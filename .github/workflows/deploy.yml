# main에 push되면 Cloudflare Workers(the.pinda.kr)에 자동 배포합니다.
# 필요한 GitHub 저장소 시크릿 (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  : 핀다AI 저장소와 같은 토큰 ("Edit Cloudflare Workers" 템플릿 + Account·D1·Edit)
#   CLOUDFLARE_ACCOUNT_ID : Cloudflare 대시보드 Workers & Pages 화면 오른쪽의 Account ID
# 수동 실행: GitHub → Actions → Deploy → Run workflow
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 시크릿 확인·정리
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tok="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          acc="$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')"
          if [ -z "$tok" ] || [ -z "$acc" ]; then
            echo "::error::GitHub 시크릿 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 가 없어 배포하지 않았습니다. README.md 참고"
            exit 1
          fi
          echo "::add-mask::$tok"; echo "::add-mask::$acc"
          echo "CLOUDFLARE_API_TOKEN=$tok" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$acc" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # content/book·blog → public/ (랜딩·블로그·안내·sitemap·OG·정사각 카드) + src/book.generated.mjs
      - name: 사이트 빌드
        run: npm run build

      - name: 코드 구문 검사
        run: npm run check

      # 표는 모두 IF NOT EXISTS 라 매번 실행해도 기존 데이터는 그대로 (핀다AI D1 공유, eb_ 접두어)
      - name: D1 스키마 반영
        run: npx wrangler d1 execute pindaai --remote --yes --file schema.sql

      - name: Workers 배포
        run: npx wrangler deploy

      # GitHub 시크릿 → Worker 비밀값 반영 (등록해 둔 것만, 앞뒤 공백 제거). 배포 뒤에 실행하므로 Worker가 이미 있음
      # 페이앱 값은 핀다AI와 같은 판매자 계정 값(페이앱 판매자 페이지 → 연동정보)을 그대로 넣으면 됨
      - name: 비밀값 반영 (GitHub 시크릿 → Cloudflare Worker)
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PAYAPP_USER_ID: ${{ secrets.PAYAPP_USER_ID }}
          PAYAPP_LINK_KEY: ${{ secrets.PAYAPP_LINK_KEY }}
          PAYAPP_LINK_VAL: ${{ secrets.PAYAPP_LINK_VAL }}
          PAYAPP_API_KEY: ${{ secrets.PAYAPP_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BIZ_NAME: ${{ secrets.BIZ_NAME }}
          BIZ_CEO: ${{ secrets.BIZ_CEO }}
          BIZ_REG_NO: ${{ secrets.BIZ_REG_NO }}
          BIZ_MAIL_ORDER_NO: ${{ secrets.BIZ_MAIL_ORDER_NO }}
          BIZ_ADDRESS: ${{ secrets.BIZ_ADDRESS }}
          BIZ_PHONE: ${{ secrets.BIZ_PHONE }}
          BIZ_EMAIL: ${{ secrets.BIZ_EMAIL }}
        run: |
          f="$RUNNER_TEMP/worker-secrets.json"
          node -e '
            const keys = ["SESSION_SECRET","PAYAPP_USER_ID","PAYAPP_LINK_KEY","PAYAPP_LINK_VAL","PAYAPP_API_KEY","ADMIN_PASSWORD","BIZ_NAME","BIZ_CEO","BIZ_REG_NO","BIZ_MAIL_ORDER_NO","BIZ_ADDRESS","BIZ_PHONE","BIZ_EMAIL"];
            const out = {};
            for (const k of keys) { const v = (process.env[k] || "").trim(); if (v) out[k] = v; }
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out));
            console.log(Object.keys(out).length ? "반영할 값: " + Object.keys(out).join(", ") : "GitHub에 등록된 비밀값 없음 → 건너뜀");
            if (!out.SESSION_SECRET) console.log("::warning::SESSION_SECRET 시크릿이 없습니다. Worker에 따로 등록하지 않았다면 열람 쿠키 서명이 기본값으로 동작하니 꼭 등록하세요");
            if (!(out.PAYAPP_USER_ID && out.PAYAPP_LINK_KEY && out.PAYAPP_LINK_VAL)) console.log("::warning::PAYAPP_USER_ID/LINK_KEY/LINK_VAL 이 없어 실제 결제가 아닌 테스트 결제창이 뜰 수 있습니다");
          ' "$f"
          if [ "$(cat "$f")" != "{}" ]; then npx wrangler secret bulk "$f"; fi
          rm -f "$f"

      - name: 배포 확인 (the.pinda.kr 응답)
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 https://the.pinda.kr/api/price | grep -q '"price"'; then echo "the.pinda.kr 정상 응답"; exit 0; fi
            sleep 10
          done
          echo "::warning::the.pinda.kr 가 아직 응답하지 않습니다 (커스텀 도메인 DNS 반영 전이면 정상). Cloudflare 대시보드에서 확인하세요"
